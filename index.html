<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Digest — Tel Aviv</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1b2a;color:#e2e8f0;min-height:100vh}
    .page{max-width:1100px;margin:0 auto;padding:40px 20px}
    h1{font-size:26px;font-weight:700;color:#6ee7c5;margin-bottom:4px}
    .subtitle{color:rgba(255,255,255,.45);font-size:13px;margin-bottom:32px}

    /* Buttons */
    .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:background .15s,transform .1s;font-family:inherit}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
    .btn-search{background:#0F6E56;color:#fff}
    .btn-search:not(:disabled):hover{background:#0a5442;transform:translateY(-1px)}
    .btn-gmail{background:#0a66c2;color:#fff}
    .btn-gmail:not(:disabled):hover{background:#004182;transform:translateY(-1px)}
    .count{background:rgba(110,231,197,.15);color:#6ee7c5;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;display:none}

    /* Status */
    .status{font-size:12px;color:rgba(255,255,255,.35);font-family:monospace;min-height:16px;margin-bottom:18px}

    /* Table */
    .table-wrap{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
    table{width:100%;border-collapse:collapse;background:#1a2d42}
    thead tr{background:#243548}
    th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6ee7c5}
    td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:rgba(255,255,255,.025)}

    /* Work type badges */
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.03em}
    .b-hybrid{background:rgba(110,231,197,.15);color:#6ee7c5}
    .b-remote{background:rgba(165,180,252,.15);color:#a5b4fc}
    .b-onsite{background:rgba(100,116,139,.14);color:#94a3b8}
    .b-unknown{background:rgba(100,116,139,.07);color:#475569;font-weight:400}

    /* Source badges */
    .b-linkedin{background:rgba(10,102,194,.25);color:#60a5fa}
    .b-indeed{background:rgba(245,158,11,.18);color:#fbbf24}

    /* Row highlight for hybrid */
    tr.row-hybrid td{background:rgba(110,231,197,.04)}
    tr.row-hybrid:hover td{background:rgba(110,231,197,.07)}

    /* Job title link */
    .job-link{color:#e2e8f0;font-weight:600;text-decoration:none}
    .job-link:hover{color:#6ee7c5;text-decoration:underline}
    .company{color:rgba(255,255,255,.65)}
    .loc{color:rgba(255,255,255,.4);font-size:12px}

    .fresh{color:#6ee7c5;font-size:12px}
    .recent{color:#f59e0b;font-size:12px}
    .old{color:#475569;font-size:12px}

    .empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.25);font-size:15px}

    /* Divider between hybrid and rest */
    tr.section-divider td{padding:3px 14px;background:rgba(255,255,255,.03);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.06)}
  </style>
</head>
<body>
<div class="page">
  <h1>Job Digest — LinkedIn + Indeed</h1>
  <p class="subtitle">Senior Implementation · TAM · CX · Enablement · Tel Aviv &amp; Center District</p>

  <div class="actions">
    <button class="btn btn-search" id="btn-search" onclick="runSearch()">&#128269; Search LinkedIn + Indeed</button>
    <button class="btn btn-gmail" id="btn-send" onclick="sendToGmail()" disabled>&#9993; Send to Gmail</button>
    <span class="count" id="count-badge"></span>
  </div>
  <div class="status" id="status">Click "Search LinkedIn + Indeed" to fetch the latest openings.</div>

  <div class="table-wrap" id="table-wrap"></div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const RECIPIENT = 'ofer.man.om@gmail.com';
const LOCATION  = 'Tel Aviv, Israel';
const CORS      = 'https://corsproxy.io/?';

const LI_QUERIES = [
  'Senior Implementation Manager OR Implementation Manager OR Senior Implementation Engineer OR Solution Implementation Manager',
  'Senior Technical Account Manager OR Technical Account Manager OR Senior TAM',
  'Senior Onboarding Engineer OR Senior CX Engineer OR Enablement Manager OR Senior Enablement Manager OR Enablement Lead OR Senior Consultant',
];

const IN_QUERIES = [
  'Senior Implementation Manager Implementation Engineer',
  'Senior Technical Account Manager TAM Onboarding',
  'Senior CX Engineer Enablement Manager Senior Consultant',
];

// ── State ────────────────────────────────────────────────────────────────────
let allJobs = [];

// ── Utilities ────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setStatus(msg){ document.getElementById('status').textContent = msg; }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function workTypePriority(wt){
  return {Hybrid:0, Remote:1, 'On-site':2, 'Not specified':3}[wt] ?? 3;
}

function postedClass(txt){
  if (!txt) return 'old';
  if (/today|\d+\s*(minute|hour)s?\s*ago/i.test(txt)) return 'fresh';
  if (/^(\d+\s*days?\s*ago|1\s*week\s*ago)$/i.test(txt)) return 'fresh';
  if (/[2-4]\s*weeks?\s*ago/i.test(txt)) return 'recent';
  return 'old';
}

function badgeClass(wt){
  return {Hybrid:'b-hybrid', Remote:'b-remote', 'On-site':'b-onsite'}[wt] || 'b-unknown';
}

function detectWorkType(text){
  const t = text.toLowerCase();
  if (/\bhybrid\b/.test(t))   return 'Hybrid';
  if (/\bremote\b/.test(t))   return 'Remote';
  if (/\bon.?site\b/.test(t)) return 'On-site';
  return 'Not specified';
}

// ── LinkedIn fetch + parse ───────────────────────────────────────────────────
async function fetchLinkedIn(keywords, location){
  const target = 'https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search'
    + `?keywords=${encodeURIComponent(keywords)}&location=${encodeURIComponent(location)}&start=0`;
  const resp = await fetch(CORS + encodeURIComponent(target));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

function parseLinkedIn(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const jobs = [];
  doc.querySelectorAll('li').forEach(card => {
    const titleEl   = card.querySelector('.base-search-card__title');
    const companyEl = card.querySelector('.base-search-card__subtitle');
    const locEl     = card.querySelector('.job-search-card__location');
    const linkEl    = card.querySelector('a.base-card__full-link');
    const timeEl    = card.querySelector('time');
    const wtEl      = card.querySelector('.job-search-card__workplace-type');
    if (!titleEl) return;

    let workType = 'Not specified';
    if (wtEl) {
      workType = detectWorkType(wtEl.textContent);
    } else {
      workType = detectWorkType(card.textContent);
    }

    jobs.push({
      title:    titleEl.textContent.trim(),
      company:  companyEl ? companyEl.textContent.trim() : '',
      location: locEl ? locEl.textContent.trim() : LOCATION,
      url:      linkEl ? linkEl.href.split('?')[0] : '',
      posted:   timeEl ? (timeEl.textContent.trim() || timeEl.getAttribute('datetime') || '') : '',
      workType,
      source:   'LinkedIn',
    });
  });
  return jobs;
}

// ── Indeed RSS fetch + parse ─────────────────────────────────────────────────
async function fetchIndeedRSS(keywords, location){
  const target = 'https://www.indeed.com/rss'
    + `?q=${encodeURIComponent(keywords)}&l=${encodeURIComponent(location)}&sort=date&fromage=30`;
  const resp = await fetch(CORS + encodeURIComponent(target));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

function parseIndeedRSS(xml){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  // Detect parse error
  if (doc.querySelector('parsererror')) return [];
  const jobs = [];

  doc.querySelectorAll('item').forEach(item => {
    const rawTitle  = item.querySelector('title')?.textContent?.trim() || '';
    const link      = item.querySelector('link')?.nextSibling?.nodeValue?.trim()
                   || item.querySelector('guid')?.textContent?.trim() || '';
    const desc      = item.querySelector('description')?.textContent || '';
    const pubDate   = item.querySelector('pubDate')?.textContent || '';

    if (!rawTitle) return;

    // Title format: "Job Title - Company Name (Location)" or "Job Title - Company Name"
    const dashIdx = rawTitle.lastIndexOf(' - ');
    let jobTitle = dashIdx > 0 ? rawTitle.substring(0, dashIdx) : rawTitle;
    let company  = dashIdx > 0 ? rawTitle.substring(dashIdx + 3) : '';
    // Strip trailing location in parens from company: "Acme Corp (Tel Aviv)"
    company = company.replace(/\s*\([^)]*\)\s*$/, '').trim();

    // Work type from description HTML
    const tmpDiv = document.createElement('div');
    tmpDiv.innerHTML = desc;
    const descText = tmpDiv.textContent || '';
    const workType = detectWorkType(descText);

    // Parse pubDate → relative string
    let posted = '';
    if (pubDate) {
      try {
        const diffDays = Math.floor((Date.now() - new Date(pubDate).getTime()) / 86400000);
        if (diffDays <= 0)      posted = 'Today';
        else if (diffDays === 1) posted = '1 day ago';
        else if (diffDays < 7)  posted = `${diffDays} days ago`;
        else if (diffDays < 14) posted = '1 week ago';
        else                    posted = `${Math.floor(diffDays/7)} weeks ago`;
      } catch(e) {}
    }

    if (jobTitle) jobs.push({
      title:    jobTitle,
      company,
      location: LOCATION,
      url:      link,
      posted,
      workType,
      source:   'Indeed',
    });
  });
  return jobs;
}

// ── Dedupe (title+company key, cross-source) ─────────────────────────────────
function dedupe(jobs){
  const seen = new Set();
  return jobs.filter(j => {
    const k = j.title.toLowerCase().replace(/\s+/g,' ') + '|' + j.company.toLowerCase().replace(/\s+/g,' ');
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderTable(jobs){
  if (!jobs.length){
    document.getElementById('table-wrap').innerHTML = '<p class="empty">No results yet.</p>';
    return;
  }

  const hybridJobs = jobs.filter(j => j.workType === 'Hybrid');
  const otherJobs  = jobs.filter(j => j.workType !== 'Hybrid');

  function sourceClass(s){ return s === 'LinkedIn' ? 'b-linkedin' : 'b-indeed'; }

  function row(j){
    const cls = j.workType === 'Hybrid' ? ' class="row-hybrid"' : '';
    return `<tr${cls}>
      <td><span class="badge ${badgeClass(j.workType)}">${esc(j.workType)}</span></td>
      <td><span class="badge ${sourceClass(j.source)}">${esc(j.source)}</span></td>
      <td>${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer" class="job-link">${esc(j.title)}</a>` : esc(j.title)}</td>
      <td class="company">${esc(j.company)}</td>
      <td class="loc">${esc(j.location)}</td>
      <td class="${postedClass(j.posted)}">${esc(j.posted)}</td>
    </tr>`;
  }

  let tbody = '';
  if (hybridJobs.length){
    tbody += `<tr class="section-divider"><td colspan="6">&#9670; Hybrid — ${hybridJobs.length} role${hybridJobs.length>1?'s':''}</td></tr>`;
    tbody += hybridJobs.map(row).join('');
  }
  if (otherJobs.length){
    if (hybridJobs.length)
      tbody += `<tr class="section-divider"><td colspan="6">Other — ${otherJobs.length} role${otherJobs.length>1?'s':''}</td></tr>`;
    tbody += otherJobs.map(row).join('');
  }

  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead><tr>
        <th>Work Type</th><th>Source</th><th>Job Title</th><th>Company</th><th>Location</th><th>Posted</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

// ── Main search ──────────────────────────────────────────────────────────────
async function runSearch(){
  const btnSearch = document.getElementById('btn-search');
  const btnSend   = document.getElementById('btn-send');
  btnSearch.disabled = true;
  btnSearch.textContent = '⏳ Searching…';
  btnSend.disabled = true;
  document.getElementById('count-badge').style.display = 'none';
  allJobs = [];

  // ── LinkedIn ─────────────────────────────────────────────────────────────
  for (let i = 0; i < LI_QUERIES.length; i++){
    setStatus(`LinkedIn [${i+1}/${LI_QUERIES.length}] ${LI_QUERIES[i].substring(0,65)}…`);
    try {
      const html = await fetchLinkedIn(LI_QUERIES[i], LOCATION);
      allJobs.push(...parseLinkedIn(html));
    } catch(e){
      setStatus(`LinkedIn [${i+1}] ⚠ ${e.message}`);
      console.error('LinkedIn error:', e);
    }
    if (i < LI_QUERIES.length - 1) await sleep(900);
  }

  await sleep(600);

  // ── Indeed ───────────────────────────────────────────────────────────────
  for (let i = 0; i < IN_QUERIES.length; i++){
    setStatus(`Indeed [${i+1}/${IN_QUERIES.length}] ${IN_QUERIES[i].substring(0,65)}…`);
    try {
      const xml = await fetchIndeedRSS(IN_QUERIES[i], LOCATION);
      allJobs.push(...parseIndeedRSS(xml));
    } catch(e){
      setStatus(`Indeed [${i+1}] ⚠ ${e.message}`);
      console.error('Indeed error:', e);
    }
    if (i < IN_QUERIES.length - 1) await sleep(900);
  }

  allJobs = dedupe(allJobs);
  allJobs.sort((a, b) => workTypePriority(a.workType) - workTypePriority(b.workType));

  renderTable(allJobs);

  const badge = document.getElementById('count-badge');
  badge.textContent = `${allJobs.length} roles found`;
  badge.style.display = 'inline-block';

  const hybridCount = allJobs.filter(j => j.workType === 'Hybrid').length;
  const liCount = allJobs.filter(j => j.source === 'LinkedIn').length;
  const inCount = allJobs.filter(j => j.source === 'Indeed').length;
  setStatus(`Done — ${allJobs.length} unique roles (${hybridCount} hybrid) · LinkedIn: ${liCount}  Indeed: ${inCount}`);

  btnSearch.disabled = false;
  btnSearch.textContent = '🔍 Search LinkedIn + Indeed';
  if (allJobs.length) btnSend.disabled = false;
}

// ── Email ─────────────────────────────────────────────────────────────────────
function sendToGmail(){
  if (!allJobs.length) return;

  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const subject = `Job Digest — LinkedIn + Indeed · Tel Aviv · ${today}`;

  // Compact one-line format to stay within Gmail URL limits (~2000 chars for body)
  const MAX_BODY = 1800;
  let lines = [];
  for (const j of allJobs) {
    lines.push(`[${j.workType}] ${j.title} @ ${j.company} | ${j.url}`);
  }
  let body = lines.join('\n');
  if (body.length > MAX_BODY) {
    const kept = [];
    let len = 0;
    for (const l of lines) {
      if (len + l.length + 1 > MAX_BODY - 40) {
        kept.push(`... and ${lines.length - kept.length} more roles`);
        break;
      }
      kept.push(l); len += l.length + 1;
    }
    body = kept.join('\n');
  }

  const mailtoUrl = 'mailto:' + encodeURIComponent(RECIPIENT)
    + '?subject=' + encodeURIComponent(subject)
    + '&body='    + encodeURIComponent(body);

  window.location.href = mailtoUrl;
  setStatus('Mail compose opened — click Send to deliver the digest.');
}
</script>
</body>
</html>
